<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobby.OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0d0e12',
                        foreground: '#e4e6eb',
                        sidebar: '#13151c',
                        card: '#181b24',
                        border: '#232836',
                        input: '#1a1d26',
                        primary: '#6366f1',
                        'primary-foreground': '#ffffff',
                        muted: '#1f2430',
                        'muted-foreground': '#8a92a6',
                        secondary: '#222530',
                        'secondary-foreground': '#ffffff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0d0e12; font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Basic clean SVG components
        const UploadIcon = () => <svg className="w-5 h-5 text-muted-foreground mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        const SearchIcon = () => <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
        const ZapIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>;
        const BuildingIcon = () => <svg className="w-5 h-5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>;
        const MapPinIcon = () => <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
        const SparklesIcon = () => <svg className="w-3.5 h-3.5 text-primary mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>;

        function JobbyOS() {
            const [file, setFile] = React.useState(null);
            const [fileName, setFileName] = React.useState(null);
            const [keyword, setKeyword] = React.useState("");
            const [isScanning, setIsScanning] = React.useState(false);
            const [jobs, setJobs] = React.useState([]);

            const handleFileChange = (e) => {
                const targetFile = e.target.files?.[0];
                if (targetFile) {
                    setFile(targetFile);
                    setFileName(targetFile.name);
                }
            };

            const handleScan = async () => {
                if (!file || !keyword.trim()) return;
                setIsScanning(true);
                setJobs([]);

                const formData = new FormData();
                formData.append("file", file);
                formData.append("keyword", keyword);

                try {
                    const response = await fetch("/api/scout", {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    
                    if (data.status === "success") {
                        setJobs(data.jobs);
                    } else {
                        alert("Error running pipeline: " + data.message);
                    }
                } catch (err) {
                    alert("Network disconnect between UI and Python Core: " + err);
                } finally {
                    setIsScanning(false);
                }
            };

            const avgMatch = jobs.length > 0 
                ? Math.round(jobs.reduce((acc, j) => acc + parseInt(j.match), 0) / jobs.length) 
                : 0;

            return (
                <div className="min-h-screen bg-background text-foreground flex h-screen">
                    {/* Sidebar */}
                    <aside className="w-72 border-r border-border bg-sidebar p-6 flex flex-col">
                        <div className="mb-8">
                            <h1 className="text-xl font-semibold tracking-tight text-foreground flex items-center gap-2">
                                <span className="text-primary font-heading">JOBBY</span>
                                <span className="text-muted-foreground font-heading">.OS</span>
                            </h1>
                            <p className="text-xs text-muted-foreground mt-1">AI Job Hunting Terminal</p>
                        </div>

                        <div className="space-y-6 flex-1">
                            {/* File Upload */}
                            <div className="space-y-2">
                                <label className="text-xs font-medium text-muted-foreground uppercase tracking-wide">Resume</label>
                                <label className="flex flex-col items-center justify-center h-28 border border-dashed border-border rounded-lg cursor-pointer hover:border-primary hover:bg-primary/5 transition-all duration-200">
                                    <input type="file" accept=".pdf" className="hidden" onChange={handleFileChange} />
                                    <UploadIcon />
                                    {fileName ? (
                                        <span className="text-sm text-primary truncate max-w-full px-2">{fileName}</span>
                                    ) : (
                                        <span className="text-sm text-muted-foreground">Upload PDF CV</span>
                                    )}
                                </label>
                            </div>

                            {/* Keyword Input */}
                            <div className="space-y-2">
                                <label className="text-xs font-medium text-muted-foreground uppercase tracking-wide">Keywords</label>
                                <div className="relative">
                                    <SearchIcon />
                                    <input
                                        type="text"
                                        value={keyword}
                                        onChange={(e) => setKeyword(e.target.value)}
                                        placeholder="e.g. Analyst, Tallinn"
                                        className="w-full bg-input border border-border rounded-lg py-2.5 pl-10 pr-4 text-sm placeholder:text-muted-foreground text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all"
                                        onKeyDown={(e) => e.key === "Enter" && handleScan()}
                                    />
                                </div>
                            </div>

                            {/* Scan Button */}
                            <button
                                onClick={handleScan}
                                disabled={isScanning || !file || !keyword.trim()}
                                className="w-full flex items-center justify-center gap-2 bg-primary text-primary-foreground py-2.5 rounded-lg font-medium text-sm hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
                            >
                                {isScanning ? (
                                    <>
                                        <div className="w-4 h-4 border-2 border-primary-foreground/30 border-t-primary-foreground rounded-full animate-spin" />
                                        Analyzing Engine...
                                    </>
                                ) : (
                                    <>
                                        <ZapIcon />
                                        Run Scan
                                    </>
                                )}
                            </button>
                        </div>

                        {/* Stats Dashboard */}
                        {jobs.length > 0 && (
                            <div className="pt-6 border-t border-border mt-6 animate-fade-in">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <p className="text-2xl font-semibold text-foreground">{jobs.length}</p>
                                        <p className="text-xs text-muted-foreground">Jobs Scoured</p>
                                    </div>
                                    <div>
                                        <p className="text-2xl font-semibold text-primary">{avgMatch}%</p>
                                        <p className="text-xs text-muted-foreground">Avg Match Score</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </aside>

                    {/* Main Window */}
                    <main className="flex-1 p-8 overflow-auto">
                        <div className="max-w-5xl mx-auto">
                            <div className="mb-8">
                                <h2 className="text-lg font-medium text-foreground">Live Execution Matrix</h2>
                                <p className="text-sm text-muted-foreground mt-1">
                                    {jobs.length > 0
                                        ? `Found ${jobs.length} evaluation profiles matching requirements`
                                        : "Input profile criteria variables inside control deck terminal to activate automation."}
                                </p>
                            </div>

                            {jobs.length === 0 && !isScanning ? (
                                <div className="flex flex-col items-center justify-center h-96 border border-dashed border-border rounded-xl bg-sidebar/30">
                                    <SparklesIcon />
                                    <p className="text-muted-foreground text-sm mt-2">Core Processor: Standby</p>
                                </div>
                            ) : (
                                <div className="grid gap-4 md:grid-cols-2">
                                    {jobs.map((job, idx) => (
                                        <div
                                            key={job.id}
                                            className="bg-card border border-border rounded-xl p-5 hover:border-primary/50 transition-all duration-300 animate-fade-in"
                                            style={{ animationDelay: `${idx * 75}ms` }}
                                        >
                                            <div className="flex items-start justify-between mb-3">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-lg bg-muted flex items-center justify-center">
                                                        <BuildingIcon />
                                                    </div>
                                                    <div>
                                                        <h3 className="font-medium text-foreground text-sm">{job.title}</h3>
                                                        <p className="text-xs text-muted-foreground">{job.company}</p>
                                                    </div>
                                                </div>
                                                <span className="text-xs font-medium px-2 py-1 rounded-full bg-primary/20 text-primary">
                                                    {job.match}%
                                                </span>
                                            </div>

                                            <div className="flex items-center gap-1 text-xs text-muted-foreground mb-3">
                                                <MapPinIcon />
                                                {job.location}
                                            </div>

                                            <div className="pt-3 border-t border-border">
                                                <div className="flex items-start gap-2">
                                                    <SparklesIcon />
                                                    <p className="text-xs text-muted-foreground leading-relaxed whitespace-pre-line">
                                                        {job.analysis}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<JobbyOS />);
    </script>
</body>
</html>
